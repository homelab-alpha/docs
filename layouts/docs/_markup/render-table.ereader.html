{{- /* Table render hook for the e-reader version: a plain table, as before. */ -}}
<table{{ partial "docs/html-attributes.html" (dict "attrs" .Attributes "page" .Page) | safeHTMLAttr }}>
  <thead>
    {{- range .THead }}
      <tr>
        {{- range . }}
          <th {{- with .Alignment }} style="text-align: {{ . }}"{{ end }}>
            {{- .Text -}}
          </th>
        {{- end }}
      </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
      <tr>
        {{- range . }}
          <td {{- with .Alignment }} style="text-align: {{ . }}"{{ end }}>
            {{- .Text -}}
          </td>
        {{- end }}
      </tr>
    {{- end }}
  </tbody>
</table>
