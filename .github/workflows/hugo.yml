---
name: 🚀 Build & Deploy Hugo Site

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/hugo.yml
      - archetypes/**
      - assets/**
      - config/**
      - content/**
      - data/**
      - i18n/**
      - layouts/**
      - static/**
      - go.mod
      - go.sum
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build only, skip artifact upload and deployment"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 🏗️ Build Hugo Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Pull requests always run as a dry run, so bot PRs (for example a
    # Hugo version bump) are allowed to build as well.
    if: |
      github.event_name == 'pull_request' ||
      (github.event.sender.type != 'Bot' &&
      !contains(github.actor, '[bot]'))

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HUGO_VERSION: 0.169.0
      DRY_RUN: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && 'true' || 'false' }}

    steps:
      - name: 🏁 Notify start of build
        run: |
          set -Eeuo pipefail
          echo "::notice title=Build Started::🏗️ Hugo build process initialized"
          echo "::group::ℹ️ Execution context"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow ref: ${{ github.ref }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Hugo version: ${{ env.HUGO_VERSION }}"
          echo "Dry run: ${DRY_RUN}"
          echo "::endgroup::"

      - name: 📥 Install Hugo CLI
        run: |
          set -Eeuo pipefail
          echo "::group::📥 Downloading and installing Hugo v${{ env.HUGO_VERSION }}"

          HUGO_DEB="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          HUGO_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"

          if ! wget -O "${{ runner.temp }}/${HUGO_DEB}" "${HUGO_URL}/${HUGO_DEB}" ||
            ! wget -O "${{ runner.temp }}/hugo_checksums.txt" \
              "${HUGO_URL}/hugo_${HUGO_VERSION}_checksums.txt"; then
            echo "::error title=Hugo Download Failed::❌ Could not download Hugo binary or checksums"
            exit 1
          fi

          if ! (cd "${{ runner.temp }}" &&
            grep -F " ${HUGO_DEB}" hugo_checksums.txt | sha256sum --check --strict -); then
            echo "::error title=Hugo Checksum Failed::❌ SHA-256 checksum of the Hugo package does not match"
            exit 1
          fi

          if ! sudo dpkg -i "${{ runner.temp }}/${HUGO_DEB}"; then
            echo "::error title=Hugo Install Failed::❌ Could not install Hugo package"
            exit 1
          fi

          echo "::notice title=Hugo Installed::✅ Hugo v${{ env.HUGO_VERSION }} installed successfully"
          echo "::endgroup::"

      - name: 🎨 Install Dart Sass
        id: dart_sass
        env:
          # Update the version and the SHA-256 of the linux-x64 archive together. Renovate only updates the version;
          # update the SHA-256 in the same pull request (`sha256sum dart-sass-<version>-linux-x64.tar.gz`).
          DART_SASS_VERSION: 1.107.1
          DART_SASS_SHA256: 6cefe78692d03ca53843394bb98de4dccf9a3d8ee5ece40be7316be852624003
        run: |
          set -Eeuo pipefail
          echo "::group::🎨 Installing Dart Sass v${DART_SASS_VERSION}"

          DART_SASS_ARCHIVE="dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          DART_SASS_URL="https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/${DART_SASS_ARCHIVE}"

          if ! wget -O "${{ runner.temp }}/${DART_SASS_ARCHIVE}" "${DART_SASS_URL}"; then
            echo "::error title=Dart Sass Download Failed::❌ Could not download Dart Sass"
            exit 1
          fi

          if ! echo "${DART_SASS_SHA256}  ${{ runner.temp }}/${DART_SASS_ARCHIVE}" | sha256sum --check --strict -; then
            echo "::error title=Dart Sass Checksum Failed::❌ SHA-256 checksum of the Dart Sass archive does not match"
            exit 1
          fi

          sudo tar -xzf "${{ runner.temp }}/${DART_SASS_ARCHIVE}" -C /opt
          echo "/opt/dart-sass" >>"$GITHUB_PATH"

          if ! /opt/dart-sass/sass --version; then
            echo "::error title=Dart Sass Failed::❌ Could not run Dart Sass"
            exit 1
          fi

          echo "::notice title=Dart Sass Installed::✅ Dart Sass v${DART_SASS_VERSION} installed successfully"
          echo "::endgroup::"

      - name: 📑 Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: ⚙️ Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 🔨 Build with Hugo
        id: hugo_build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Amsterdam
        run: |
          set -Eeuo pipefail
          echo "::group::🔨 Hugo Compilation"

          HUGO_ARGS=(--gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/")

          # Newly deprecated features are only logged at info level.
          if [[ "${DRY_RUN}" == "true" ]]; then
            HUGO_ARGS+=(--logLevel info)
          fi

          if ! hugo "${HUGO_ARGS[@]}"; then
            echo "::error title=Hugo Build Failed::❌ Hugo compilation encountered errors"
            echo "::endgroup::"
            exit 1
          fi

          echo "::notice title=Hugo Build::✅ Site compiled successfully"
          echo "::endgroup::"

      - name: 📤 Upload artifact
        id: upload
        if: env.DRY_RUN != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

      - name: 📊 Generate job summary
        if: always()
        run: |
          set -Eeuo pipefail
          echo "::group::📊 Generating Summary Report"

          BUILD_STATUS="${{ steps.hugo_build.outcome == 'success' && '✅ Success' || '❌ Failed' }}"
          SASS_STATUS="${{ steps.dart_sass.outcome == 'success' && '✅ Success' || '❌ Failed' }}"
          UPLOAD_STATUS="${{ steps.upload.outcome == 'success' && '✅ Uploaded' || '⏭️ Skipped' }}"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🏗️ Build Summary

          Execution completed at: $(date -u)

          ### 📈 Execution Results

          | Step                 | Result         |
          | :------------------- | :------------- |
          | 🎨 Dart Sass Install | $SASS_STATUS   |
          | 🔨 Hugo Compilation  | $BUILD_STATUS  |
          | 📤 Artifact Upload   | $UPLOAD_STATUS |

          ### ⚙️ Runtime Configuration

          - **Hugo Version:** ${{ env.HUGO_VERSION }}
          - **Dry Run:** ${DRY_RUN}
          - **Environment:** production
          - **Base URL:** ${{ steps.pages.outputs.base_url }}
          - **Timezone:** Europe/Amsterdam

          ### 🧩 Workflow Details

          - **Workflow Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          echo "::endgroup::"

  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    if: |
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      inputs.dry_run != true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: 📊 Generate deployment summary
        if: always()
        run: |
          set -Eeuo pipefail
          echo "::group::📊 Generating Deployment Summary"

          DEPLOY_STATUS="${{ steps.deployment.outcome == 'success' && '✅ Success' || '❌ Failed' }}"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Deployment Summary

          Execution completed at: $(date -u)

          ### 📈 Results

          | Step               | Result         |
          | :----------------- | :------------- |
          | 🚀 Deploy to Pages | $DEPLOY_STATUS |

          ### 🌐 Site Details

          | Key      | Value                                                      |
          | :------- | :--------------------------------------------------------- |
          | **URL**  | [View Live Site](${{ steps.deployment.outputs.page_url }}) |

          ### 🧩 Workflow Details

          - **Workflow Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          echo "::endgroup::"
