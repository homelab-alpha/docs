---
name: 🚀 Build & Deploy Hugo Site

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/hugo.yml
      - archetypes/**
      - assets/**
      - config/**
      - content/**
      - data/**
      - i18n/**
      - layouts/**
      - static/**
      - go.mod
      - go.sum
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build only, skip artifact upload and deployment"
        type: boolean
        default: true

# No permission for the workflow as a whole. Each job asks for what it needs.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 🏗️ Build Hugo Site
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    # A push is skipped when it creates the repository from the template: the Initialize Repository workflow
    # replaces that history, so nothing should run for it.
    if: |
      github.event.created != true

    # The build runs the content of a pull request, so it only reads. Only the deploy job may write to Pages.
    permissions:
      contents: read
      pages: read # Setup Pages reads the site settings. The build job only reads.

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HUGO_VERSION: 0.170.0
      DRY_RUN: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && 'true' || 'false' }}

    steps:
      - name: 🏁 Notify start of build
        run: |
          set -Eeuo pipefail
          echo "::notice title=Build Started::🏗️ Hugo build process initialized"
          echo "::group::ℹ️ Execution context"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Workflow ref: ${GITHUB_REF}"
          echo "Runner OS: ${RUNNER_OS}"
          echo "Hugo version: ${HUGO_VERSION}"
          echo "Dry run: ${DRY_RUN}"
          echo "::endgroup::"

      - name: 📥 Install Hugo CLI
        run: |
          set -Eeuo pipefail
          echo "::group::📥 Downloading and installing Hugo v${HUGO_VERSION}"

          HUGO_DEB="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          HUGO_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"

          if ! wget -O "${RUNNER_TEMP}/${HUGO_DEB}" "${HUGO_URL}/${HUGO_DEB}" ||
            ! wget -O "${RUNNER_TEMP}/hugo_checksums.txt" \
              "${HUGO_URL}/hugo_${HUGO_VERSION}_checksums.txt"; then
            echo "::error title=Hugo Download Failed::❌ Could not download Hugo binary or checksums"
            exit 1
          fi

          if ! (cd "${RUNNER_TEMP}" &&
            grep -F " ${HUGO_DEB}" hugo_checksums.txt | sha256sum --check --strict -); then
            echo "::error title=Hugo Checksum Failed::❌ SHA-256 checksum of the Hugo package does not match"
            exit 1
          fi

          if ! sudo dpkg -i "${RUNNER_TEMP}/${HUGO_DEB}"; then
            echo "::error title=Hugo Install Failed::❌ Could not install Hugo package"
            exit 1
          fi

          echo "::notice title=Hugo Installed::✅ Hugo v${HUGO_VERSION} installed successfully"
          echo "::endgroup::"

      - name: 🎨 Install Dart Sass
        id: dart_sass
        env:
          # Renovate updates the version. The SHA-256 of the linux-x64 archive is read from the digest that GitHub
          # records for the release asset, so there is no checksum to update by hand.
          DART_SASS_VERSION: 1.108.2
        run: |
          set -Eeuo pipefail
          echo "::group::🎨 Installing Dart Sass v${DART_SASS_VERSION}"

          DART_SASS_ARCHIVE="dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          DART_SASS_URL="https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/${DART_SASS_ARCHIVE}"

          if ! wget -O "${RUNNER_TEMP}/${DART_SASS_ARCHIVE}" "${DART_SASS_URL}"; then
            echo "::error title=Dart Sass Download Failed::❌ Could not download Dart Sass"
            exit 1
          fi

          if ! DART_SASS_SHA256="$(gh api "repos/sass/dart-sass/releases/tags/${DART_SASS_VERSION}" \
            --jq ".assets[] | select(.name == \"${DART_SASS_ARCHIVE}\") | .digest | ltrimstr(\"sha256:\")")" ||
            [[ ! "${DART_SASS_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Dart Sass Digest Failed::❌ Could not read the SHA-256 digest of the Dart Sass release"
            exit 1
          fi

          if ! echo "${DART_SASS_SHA256}  ${RUNNER_TEMP}/${DART_SASS_ARCHIVE}" | sha256sum --check --strict -; then
            echo "::error title=Dart Sass Checksum Failed::❌ SHA-256 checksum of the Dart Sass archive does not match"
            exit 1
          fi

          sudo tar -xzf "${RUNNER_TEMP}/${DART_SASS_ARCHIVE}" -C /opt
          echo "/opt/dart-sass" >>"$GITHUB_PATH"

          if ! /opt/dart-sass/sass --version; then
            echo "::error title=Dart Sass Failed::❌ Could not run Dart Sass"
            exit 1
          fi

          echo "::notice title=Dart Sass Installed::✅ Dart Sass v${DART_SASS_VERSION} installed successfully"
          echo "::endgroup::"

      - name: 📑 Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: ⚙️ Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 🔨 Build with Hugo
        id: hugo_build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Amsterdam
          STEP_PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -Eeuo pipefail
          echo "::group::🔨 Hugo Compilation"

          HUGO_ARGS=(--gc --minify --baseURL "${STEP_PAGES_BASE_URL}/")

          # Newly deprecated features are only logged at info level.
          if [[ "${DRY_RUN}" == "true" ]]; then
            HUGO_ARGS+=(--logLevel info)
          fi

          if ! hugo "${HUGO_ARGS[@]}"; then
            echo "::error title=Hugo Build Failed::❌ Hugo compilation encountered errors"
            echo "::endgroup::"
            exit 1
          fi

          echo "::notice title=Hugo Build::✅ Site compiled successfully"
          echo "::endgroup::"

      - name: 📤 Upload artifact
        id: upload
        if: env.DRY_RUN != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

      - name: 📊 Generate job summary
        if: always()
        env:
          BUILD_STATUS: ${{ steps.hugo_build.outcome == 'success' && '✅ Success' || '❌ Failed' }}
          SASS_STATUS: ${{ steps.dart_sass.outcome == 'success' && '✅ Success' || '❌ Failed' }}
          UPLOAD_STATUS: ${{ steps.upload.outcome == 'success' && '✅ Uploaded' || '⏭️ Skipped' }}
          STEP_PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -Eeuo pipefail
          echo "::group::📊 Generating Summary Report"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🏗️ Build Summary

          Execution completed at: $(date -u)

          ### 📈 Execution Results

          | Step                 | Result         |
          | :------------------- | :------------- |
          | 🎨 Dart Sass Install | $SASS_STATUS   |
          | 🔨 Hugo Compilation  | $BUILD_STATUS  |
          | 📤 Artifact Upload   | $UPLOAD_STATUS |

          ### ⚙️ Runtime Configuration

          - **Hugo Version:** ${HUGO_VERSION}
          - **Dry Run:** ${DRY_RUN}
          - **Environment:** production
          - **Base URL:** ${STEP_PAGES_BASE_URL}
          - **Timezone:** Europe/Amsterdam

          ### 🧩 Workflow Details

          - **Workflow Run:** [View Details](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          echo "::endgroup::"

  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: build

    if: |
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      inputs.dry_run != true

    permissions:
      pages: write # Deploy the built site to GitHub Pages.
      id-token: write # Prove with an OIDC token that the deployment comes from this workflow.

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: 📊 Generate deployment summary
        if: always()
        env:
          DEPLOY_STATUS: ${{ steps.deployment.outcome == 'success' && '✅ Success' || '❌ Failed' }}
          STEP_DEPLOYMENT_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -Eeuo pipefail
          echo "::group::📊 Generating Deployment Summary"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Deployment Summary

          Execution completed at: $(date -u)

          ### 📈 Results

          | Step               | Result         |
          | :----------------- | :------------- |
          | 🚀 Deploy to Pages | $DEPLOY_STATUS |

          ### 🌐 Site Details

          | Key     | Value                                         |
          | :------ | :-------------------------------------------- |
          | **URL** | [View Live Site](${STEP_DEPLOYMENT_PAGE_URL}) |

          ### 🧩 Workflow Details

          - **Workflow Run:** [View Details](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          echo "::endgroup::"
