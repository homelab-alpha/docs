baseURL                = "https://homelab-alpha.nl"
defaultContentLanguage = "en"
disableAliases         = false
disableKinds           = ["rss"]
enableEmoji            = true
enableGitInfo          = true
locale                 = "en-NL"
timeZone               = "Europe/Amsterdam"
title                  = "Homelab-Alpha | Your gateway to Homelab-Alpha's open source documentation."

[build]
  noJSConfigInAssets = true

[module]
  [module.hugoVersion]
    extended = true
    min      = "0.140.0"

  [[module.imports]]
    path    = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[taxonomies]
  category = "categories"
  series   = "series"
  tag      = "tags"
  keyword  = "keywords"

# Lightweight HTML version for e-reader browsers (Kindle, Kobo). It has no
# JavaScript, no web fonts, and no CSS variables. See layouts/**/*.ereader.html.
[outputFormats.ereader]
  mediaType = "text/html"
  baseName  = "index"
  path      = "ereader"
  isHTML    = true

[outputs]
  home    = ["html", "ereader"]
  section = ["html", "ereader"]
  page    = ["html", "ereader"]
