sans_serif_font = "Inter"
secondary_font  = "Inter"
mono_font       = "JetBrains Mono"

[landingpage]
  enabled = false

[head]
  author = "Homelab-Alpha"
  description = "Your gateway to Homelab-Alpha's open source documentation."
  keywords = "Homelab-Alpha, Homelab-Alpha Documentation, GitHub, GitHub Repositories, GitHub Projects, Documentation, Homelab, Aplha, Open Source"
  # email = ""
  website = "https://homelab-alpha.nl"
  version = "v0.1.3"

[footer]
copyright = "&copy; [Homelab-Alpha](https://homelab-alpha.nl) 2024. Developed by [GJS](https://github.com/homelab-alpha) is licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
  version = true

[social]
  github = "homelab-alpha"

[docs]
  title           = "Homelab-Alpha"
  pathName        = "docs"
  themeColor      = "blue"
  darkMode        = true
  prism           = true
  prismTheme      = "main"

  repoURL         = "https://github.com/homelab-alpha/docs"
  repoBranch      = "main"
  editPage        = true
  lastMod         = true
  lastModRelative = true
  GitLastmodTime  = true

  toc             = true
  tocMobile       = false
  scrollSpy       = true

  sidebarIcons    = true
  titleIcon       = false
  simpleIcons     = false

  breadcrumbs     = true
  navDesc         = true
  navDescTrunc    = 50

  listDescTrunc   = 50
  backToTop       = true

  descriptions    = true

  intLinkTooltip  = true
  extLinkNewTab   = true
  logoLinkURL     = "/docs/"

[flexsearch]
  enabled             = true
  tokenize            = "full"
  cache               = true
  minQueryChar        = 3
  maxResult           = 30
  searchSectionsIndex = []
  tag                 = true
