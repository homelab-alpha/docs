sans_serif_font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"
secondary_font  = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"
mono_font       = "'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"

[landingpage]
  enabled = false

[head]
  author = "Homelab-Alpha"
  description = "Your gateway to Homelab-Alpha's open source documentation."
  keywords = "Homelab-Alpha, Homelab-Alpha Documentation, GitHub, GitHub Repositories, GitHub Projects, Documentation, Homelab, Aplha, Open Source"
  # email = ""
  website = "https://homelab-alpha.nl"
  version = "v0.1.3"

# Hosts of the remote images in the content. Keep this list in line with
# [http] urls in security.toml: Hugo may fetch only from these hosts, and the
# Content Security Policy (layouts/partials/docs/csp.html and the e-reader
# head) allows them as image sources, for an image that could not be fetched.
[security]
  imageHosts = ["https://raw.githubusercontent.com", "https://res.cloudinary.com", "https://skillicons.dev"]

[footer]
copyright = "&copy; Homelab-Alpha :YEAR: · Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
  version = true

[docs]
  title           = "Homelab-Alpha"
  pathName        = "docs"
  themeColor      = "blue"
  darkMode        = true

  repoURL         = "https://github.com/homelab-alpha/docs"
  repoBranch      = "main"
  editPage        = true
  lastMod         = true
  lastModRelative = true
  GitLastmodTime  = true

  toc             = true
  scrollSpy       = true

  sidebarIcons    = true
  titleIcon       = false

  breadcrumbs     = true
  navDesc         = true
  navDescTrunc    = 50

  listDescTrunc   = 50
  backToTop       = true

  descriptions    = true

  intLinkTooltip  = true
  extLinkNewTab   = true
  # The book icon (sidebar and toolbar) goes to the home page; the home icon
  # of the breadcrumbs goes to /docs/.
  logoLinkURL     = "/"

[flexsearch]
  enabled             = true
  tokenize            = "full"
  cache               = true
  minQueryChar        = 3
  maxResult           = 30
  searchSectionsIndex = []
  tag                 = true
