defaultMarkdownHandler = "goldmark"

[markup.highlight]
  # Code blocks are highlighted at build time with CSS classes (Chroma); the
  # colors are in assets/docs/scss/custom/plugins/chroma/_github.scss.
  codeFences = true
  guessSyntax = false
  lineNumbersInTable = true
  noClasses = false

[tableOfContents]
  endLevel = 3
  ordered = false
  startLevel = 1

[goldmark]
  [goldmark.renderer]
    hardWraps = false
    unsafe = true
    xhtml = false

  [goldmark.parser]
    autoHeadingID = true
    autoHeadingIDType = "github"

  [goldmark.parser.attribute]
    block = true
    title = true

  [goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true

    [goldmark.extensions.passthrough]
    enable = true

      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]
