---
# Landing page at / (layouts/index.html). It is shown only when
# params.landingpage.enabled is true; otherwise / redirects to /docs/.
#
# Each section has:
#   enable:   show the section (true or false)
#   weight:   order on the page, low to high
#   template: partial in layouts/partials/landing/ (hero, card_grid,
#             feature_grid, or cta)
# Icons are Material Symbols names from assets/icons/material/.

hero:
  enable: true
  weight: 10
  template: hero

  eyebrow: "Open source documentation"
  title: "Homelab-Alpha"
  subtitle: >-
    Guides, scripts, and configurations for a **self-hosted homelab**. From Docker Compose stacks and DNS filtering to
    shell scripts and certificates.

  ctaButton:
    icon: menu_book
    btnText: "Read the docs"
    url: "/docs/"
  cta2Button:
    icon: code
    btnText: "View on GitHub"
    url: "https://github.com/homelab-alpha"

  # Lines in the terminal card, in the style of the GitHub profile README:
  # every command gets the prompt "┌──(<user>@<host>)-[<path>]" / "└─$"; the
  # path starts at "~" and follows "cd". The title is "<user>@<host>: ~"
  # (set "title" to use another). A line that starts with "$ " is a
  # command,
  # "[+]" is a progress line, and "✔ " is a Docker Compose result:
  # "✔ <object> <name>  <state>  <time>" (two spaces before the state).
  terminal:
    user: "guest"
    host: "homelab-alpha"
    lines:
      - "$ git clone https://github.com/homelab-alpha/docker.git"
      - "$ cd docker/compose-files/dozzle"
      - "$ docker compose up -d"
      - "[+] Running 2/2"
      - "✔ Network dozzle  Created  0.1s"
      - "✔ Container dozzle  Started  0.1s"

docs:
  enable: true
  weight: 20
  template: card_grid

  title: "Explore the documentation"
  subtitle: "Pick a topic and start building."

  items:
    - title: "AdGuard Home"
      icon: dns
      description: "Network-wide blocking of ads, trackers, and phishing with filter lists."
      url: "/adguard-home/"
    - title: "Back to Basics"
      icon: design_services
      description: "Guides on Docker, Markdown, and more, for beginners and as a refresher."
      url: "/back-to-basics/"
    - title: "Contributing"
      icon: heart_plus
      description: "Help improve the documentation or the code."
      url: "/contributing/"
    - title: "Docker"
      icon: devices
      description: "Compose stacks, networks, and images for a containerized homelab."
      url: "/docker/"
    - title: "Dotfiles"
      icon: home_storage
      description: "A personal shell environment with a menu-driven installer."
      url: "/dotfiles/"
    - title: "Kairos"
      icon: bolt
      description: "A Home Assistant card for day-ahead electricity prices."
      url: "/kairos/"
    - title: "Linux"
      icon: code
      description: "Commands, configuration, and tips for the systems that run your homelab."
      url: "/linux/"
    - title: "OpenSSL"
      icon: shield_locked
      description: "Self-signed certificates for a homelab and for testing."
      url: "/openssl/"
    - title: "Shell Script"
      icon: deployed_code
      description: "Scripts and shell functions that automate everyday system tasks."
      url: "/shell-script/"

features:
  enable: true
  weight: 30
  template: feature_grid

  title: "Made to read"
  subtitle: "A fast, private documentation site that works on every screen."

  items:
    - title: "Fast"
      icon: speed
      description: "Scores 100 on Google Lighthouse. Scripts and diagrams load only when a page needs them."
    - title: "Themes"
      icon: dark_mode
      description:
        "Light, dark, or the theme of your system, in the GitHub colors, with high contrast and colorblind themes."
    - title: "Reading options"
      icon: text_fields
      description:
        "Choose a legible or dyslexia-friendly font, the text size, wider spacing, a narrow column, and less motion."
    - title: "Code options"
      icon: code_blocks
      description: "Line numbers, wrapped lines, dark code, three sizes, and visible whitespace for every code block."
    - title: "Search"
      icon: search
      description: "Full-text search of all pages, right in the browser."
    - title: "English and Dutch"
      icon: translate
      description: "Every page is in English and in Dutch. Switch the language from any page."
    - title: "E-reader version"
      icon: chrome_reader_mode
      description: "A light version of every page for e-readers and slow connections."
    - title: "No third parties"
      icon: visibility_off
      description: "No trackers, no external fonts or icons. Everything comes from this site."
    - title: "Open source"
      icon: public
      description: "All content and code are on GitHub, licensed under CC BY-NC-SA 4.0."

projects:
  enable: true
  weight: 40
  template: card_grid

  title: "Projects on GitHub"
  subtitle: "The repositories behind the documentation."

  # Take the items from a section of data/links.yaml (the /links/ page).
  linksSection: "projects"
  external: true

community:
  enable: true
  weight: 50
  template: cta

  icon: groups
  title: "Join the community"
  subtitle: "Ask questions, share ideas, and get help with your homelab."

  ctaButton:
    icon: forum
    btnText: "GitHub Discussions"
    url: "https://github.com/homelab-alpha/homelab-alpha/discussions"
  cta2Button:
    icon: link
    btnText: "All links"
    url: "/links/"
